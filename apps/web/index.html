<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("arb-guardian-theme-v6");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="Contract-enforced spend policy for delegated funds. Give an agent, bot or operator money without giving it the ability to drain the account — allowlists, per-asset daily caps and unlimited-approval refusal enforced onchain on Arbitrum and Robinhood Chain."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:title" content="Arb Guardian · Enforceable spend policy for delegated funds" />
    <meta
      property="og:description"
      content="Bound what an agent, bot or operator can move: per-asset daily caps, allowlisted counterparties, no standing approvals — enforced by a real Gnosis Safe guard and reproducible from source."
    />
    <meta property="og:image" content="https://arb-guardian.vercel.app/logo.png" />
    <meta property="og:url" content="https://arb-guardian.vercel.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Arb Guardian · Enforceable spend policy for delegated funds" />
    <meta
      name="twitter:description"
      content="Deny-by-default limits, a USDG-ready token lane and a versioned policy attestation, enforced inside a real Gnosis Safe guard."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@500;600;700;800&family=Pixelify+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Arb Guardian · Enforceable spend policy for delegated funds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
