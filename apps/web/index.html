<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("arb-guardian-theme-v6");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="Arb Guardian — guild bank protection for gaming teams. Check spends, block scams, freeze with an officer click. Live on Arbitrum and Robinhood Chain."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:title" content="Arb Guardian · Guild bank protection" />
    <meta property="og:description" content="Check guild spends before anyone signs. Practice mode · live bank rules on Arbitrum and Robinhood Chain." />
    <meta property="og:image" content="https://arb-guardian.vercel.app/logo.png" />
    <meta property="og:url" content="https://arb-guardian.vercel.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Arb Guardian · Guild bank protection" />
    <meta name="twitter:description" content="Check guild spends before anyone signs. Practice mode · live bank rules." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@500;600;700;800&family=Pixelify+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Arb Guardian · Guild bank protection</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
