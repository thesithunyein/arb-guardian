services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - PORT=8787
      - API_KEY=${API_KEY:-}
      - ARBITRUM_SEPOLIA_RPC_URL=${ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      - SUBMISSION_POLICY_MANAGER_ADDRESS=${SUBMISSION_POLICY_MANAGER_ADDRESS:-}
      - SUBMISSION_EXECUTION_GUARD_ADDRESS=${SUBMISSION_EXECUTION_GUARD_ADDRESS:-}
      - SUBMISSION_POLICY_MANAGER_TX=${SUBMISSION_POLICY_MANAGER_TX:-}
      - SUBMISSION_EXECUTION_GUARD_TX=${SUBMISSION_EXECUTION_GUARD_TX:-}
      - SUBMISSION_NETWORK=${SUBMISSION_NETWORK:-Arbitrum Sepolia}
      - OPERATOR_PRIVATE_KEY=${OPERATOR_PRIVATE_KEY:-}
    ports:
      - "8787:8787"
    volumes:
      - ./apps/api/data:/app/apps/api/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
