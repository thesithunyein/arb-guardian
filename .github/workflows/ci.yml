name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      # Type errors were previously allowed to accumulate here; the workspace is clean now and
      # this step keeps it that way.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -w packages/contracts
      # The operator integration example: dry-run, decode the refusal, stamp the decision.
      - run: npm run example:operator -w packages/contracts
      # Regenerates evidence/guard-proof.{md,json} and fails the build if any case stops
      # behaving as specified, or if the policy digest chain stops replaying.
      - run: npm run evidence -w packages/contracts
      # Reads the bytecode at every recorded address over public RPC and fails when a
      # network's declared status and the chain disagree. Needs no keys.
      - run: npm run check:deployed
      # The policy client every surface shares. Its ABI, role hashes, limit semantics and
      # revert decoding are asserted here, then driven against the real deployment below.
      # A fetch path is only a string until something checks it against the handlers on disk.
      - run: npm run check:routes
      - run: npm run test -w packages/shared
      # Includes the live suite: read-only eth_call against the deployed PolicyManager, so a
      # client that no longer matches the chain fails the build instead of failing a user.
      - run: npm run test -w apps/api
      - run: npm run eval:policy -w apps/api
      - run: npm run build -w packages/shared
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web
      - name: Publish guard proof
        uses: actions/upload-artifact@v4
        with:
          name: guard-proof
          path: |
            packages/contracts/evidence/guard-proof.md
            packages/contracts/evidence/guard-proof.json
          if-no-files-found: error
